# --- Terminal / colors (true color inside tmux, needed for Neovim themes)
set -g default-terminal "tmux-256color"
set -sa terminal-features ",xterm-256color:RGB"

# --- Behaviour that matters for Neovim
set -sg escape-time 10        # default 500ms makes <Esc> in Neovim feel laggy
set -g focus-events on        # lets Neovim notice focus changes
set -g mouse on
set -g history-limit 50000

# --- Numbering: start at 1 (matches the keyboard row), keep windows contiguous
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- Prefix: Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Config reload: <prefix> r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- New windows/panes open in the current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# --- Vim-style pane navigation: <prefix> h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Copy mode: vi keys. <prefix> [ to enter, v to select, y to copy
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
set -g set-clipboard on       # copy reaches the Windows clipboard via OSC 52

# --- Theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# --- Status line
set -g status-left "[#S] "
set -g status-left-length 50
set -g status-right " %H:%M %d-%b-%y"

# --- Seamless Neovim <-> tmux navigation (pairs with vim-tmux-navigator)
# If the pane is running (n)vim, pass the key through; otherwise move pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Ctrl-l normally clears the screen; it's taken now, so <prefix> Ctrl-l does it
bind C-l send-keys 'C-l'
